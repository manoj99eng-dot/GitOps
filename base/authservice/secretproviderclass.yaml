apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: authservice-secrets
  namespace: default
spec:
  provider: aws

  secretObjects:
    - secretName: authservice-secret
      type: Opaque
      data:
        - objectName: JWT_SECRET_KEY
          key: JWT_SECRET_KEY
        - objectName: DB_HOST
          key: DB_HOST
        - objectName: DB_PORT
          key: DB_PORT
        - objectName: DB_NAME
          key: DB_NAME
        - objectName: DB_USER
          key: DB_USER
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: DB_SSLCERT
          key: DB_SSLCERT

  parameters:
    objects: |
      - objectName: "authservice/prod"
        objectType: "secretsmanager"
        jmesPath:
          - path: JWT_SECRET_KEY
            objectAlias: JWT_SECRET_KEY
          - path: DB_HOST
            objectAlias: DB_HOST
          - path: DB_PORT
            objectAlias: DB_PORT
          - path: DB_NAME
            objectAlias: DB_NAME
          - path: DB_USER
            objectAlias: DB_USER
          - path: DB_PASSWORD
            objectAlias: DB_PASSWORD
          - path: DB_SSLCERT
            objectAlias: DB_SSLCERT
